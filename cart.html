<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart - FigureVault</title>

 <script type="module"

<button class="menu-btn"

         <h1>Your Cart</h1>
        <nav id="navMenu">
